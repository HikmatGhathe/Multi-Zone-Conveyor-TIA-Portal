<text x="121" y="705" class="mini">Photo-eye detection  •  Zone handshakes  •  Motor interlocks  •  8 s timeouts</text>
<text x="121" y="738" class="mini">Barcode routing  •  Pneumatic sorting  •  Fault diagnostics  •  HMI supervision</text>
