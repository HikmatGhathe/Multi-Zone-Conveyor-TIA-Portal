<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Concept drawing of a three zone accumulation conveyor feeding a pneumatic sorting diverter">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071422"/><stop offset="1" stop-color="#142841"/></linearGradient>
<linearGradient id="belt" x2="0" y2="1"><stop stop-color="#526272"/><stop offset=".5" stop-color="#273747"/><stop offset="1" stop-color="#47596a"/></linearGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#c9d6e2"/><stop offset="1" stop-color="#71879e"/></linearGradient>
<linearGradient id="box" x2="0" y2="1"><stop stop-color="#f0ba7f"/><stop offset="1" stop-color="#b7793c"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity=".45"/></filter>
<pattern id="rollers" width="46" height="84" patternUnits="userSpaceOnUse"><rect width="46" height="84" fill="url(#belt)"/><rect x="4" y="6" width="28" height="70" rx="9" fill="#9eafbf"/><rect x="7" y="8" width="22" height="66" rx="9" fill="#607589"/><path d="M 11 10 V72" stroke="#d1dbe3" opacity=".5" stroke-width="2"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#50d0f0"/></marker>
<style>
.title{font:700 47px Arial,sans-serif;fill:#f1f8ff}.sub{font:22px Arial,sans-serif;fill:#adc6d8}.lbl{font:700 24px Arial,sans-serif;fill:#fff}.mini{font:17px Arial,sans-serif;fill:#afc6da}.tag{font:700 20px Arial,sans-serif;fill:#50d9ec}.note{font:15px Arial,sans-serif;fill:#a8bfd0}
</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".11" stroke="#99b9ce"><path d="M0 235 H1600 M0 680 H1600 M70 0 V900 M250 0 V900 M430 0 V900 M610 0 V900 M790 0 V900 M970 0 V900 M1150 0 V900 M1330 0 V900 M1510 0 V900"/></g>
